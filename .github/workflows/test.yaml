name: CI

on:
    pull_request:
    push:
        branches: [main, master]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package*.json
            - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
            - run: npm run build
            - run: npm run lint
            - run: npm test
            - run: node --import ./.test-dist/test/setup.js .test-dist/scripts/verify-offline.js
            - run: node .test-dist/scripts/check-actor-package.js
